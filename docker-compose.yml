services:
  postgres:
    image: postgres:17-alpine
    container_name: apex-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex
      POSTGRES_DB: apex
    volumes:
      - apex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d apex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  apex_pgdata:
